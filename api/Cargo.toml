[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-primitives = { version = "1.5.2", features = ["serde"] }
axum = { version = "0.7.9", features = ["json"] }
bcs = "0.1.6"
borsh = { version = "1.6.0", features = ["derive"] }
base64 = "0.22.1"
chrono = { features = ["serde"], version = "0.4.40" }
crossbeam = "0.8.4"
dashmap = "6.1.0"
eyre = "0.6.12"
futures = "0.3.31"
lru = "0.16.2"
parking_lot = "0.12.5"
rand = "0.8.5"
redis = { version = "0.25.4", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12.12", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
sui_sdk = { git = "https://github.com/mystenlabs/sui", package = "sui-sdk"}
tokio = { version = "1.2", features = ["full"] }
tokio-stream = "0.1.17"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
url = { version = "2.5.7", features = ["serde"] }
anyhow = "1.0.100"
dotenvy = "0.15.7"
thiserror = "2.0.17"
